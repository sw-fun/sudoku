[package]
name = "suduko-ui"
description = "Yew/WASM frontend for the Sudoku game"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-timers = "0.4.0"
js-sys = "0.3.104"
suduko-engine = { version = "0.2.0", path = "../../../engine/crates/suduko-engine" }
suduko-game = { version = "0.2.0", path = "../suduko-game" }
suduko-grid = { version = "0.2.0", path = "../../../engine/crates/suduko-grid" }
suduko-tutor = { version = "0.2.0", path = "../../../tutor/crates/suduko-tutor" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3.104", features = ["Window", "Document", "Element", "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent", "Event", "EventListener", "EventTarget"] }
yew = { version = "0.21", features = ["csr"] }

[lints]
workspace = true

[dev-dependencies]
suduko-grid = { path = "../../../engine/crates/suduko-grid" }
